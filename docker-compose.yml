services:
  patient-db:
    image: postgres:16
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: patient
    ports:
      - "5433:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u patient -d patient_db"]
      interval: 5s
      retries: 10
volumes:
  patient-db-data:
