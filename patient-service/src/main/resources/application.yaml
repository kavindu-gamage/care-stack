spring:
    application:
        name: patient-service
    datasource:
        url: jdbc:postgresql://localhost:5433/patient_db
        username: patient
        password: patient
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    flyway:
        enabled: true
    
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    endpoint:
        health:
            show-details: always

